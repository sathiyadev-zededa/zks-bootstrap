apiVersion: v2
name: rt-webhook
description: >
  ZEDEDA RT Mutating Admission Webhook — Saudi Aramco Edge Demo.
  Automatically pins pods labelled rt-workload=true to the isolated
  PREEMPT_RT CPU core (core 3) with SCHED_FIFO capabilities.
  TLS certs generated by Helm's built-in genCA/genSignedCert — no cert-manager required.

type: application
version: 1.1.1
appVersion: "1.0.0"

keywords:
  - real-time
  - preempt-rt
  - edge
  - webhook
  - k3s
  - aramco

maintainers:
  - name: ZEDEDA EdgePlatform
    email: platform@zededa.com
